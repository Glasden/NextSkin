# 文档站（ADR-0054）：改了相关的文件时只构建；维护者发布正式版的 Release 以后，在那个标签上构建并部署到 Cloudflare Workers。
# 只部署已发布的正式版里最新的那一个：给旧的次版本发修订版，不会把文档退回旧版本（判断方法同 release-image-tags.yml）。
# 部署失败后从 Actions 页面手动运行，选那个 v* 标签。
# 第三方 action 固定到提交 SHA，升级时连同注释里的版本号一起改（同 ci.yml）。
name: Docs

on:
  push:
    branches: [main, 'release/**']
    paths:
      - apps/docs/**
      - packages/plugin-sdk/docs/**
      # 插槽一览读插槽的登记表和页面名的文案（ADR-0060）
      - packages/plugin-host/src/slots.ts
      - packages/i18n/messages/zh-CN.json
      - packages/plugin-sdk/package.json
      - packages/launcher/package.json
      - packages/ui/src/fonts/**
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - apps/docs/**
      - packages/plugin-sdk/docs/**
      - packages/plugin-host/src/slots.ts
      - packages/i18n/messages/zh-CN.json
      - packages/plugin-sdk/package.json
      - packages/launcher/package.json
      - packages/ui/src/fonts/**
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  build:
    # 插件 SDK 的 Release（标签是 @nextskin/plugin-sdk@…）和预发布不走这里
    if: ${{ github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy=false
          if [ "$GITHUB_EVENT_NAME" = release ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo '::error::手动运行时选一个 v* 标签'
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
            if ! [[ "$GITHUB_REF_NAME" == v* && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$GITHUB_REF_NAME 不是正式版的标签"
              exit 1
            fi
            # 已发布的正式版（不含草稿和预发布），再加上这一个：列表可能还没反映刚发布的这次
            published=$(
              gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
                --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p'
            )
            if [ "$(printf '%s\n%s\n' "$published" "$version" | sort -V | tail -n 1)" = "$version" ]; then
              deploy=true
            else
              echo "::notice::$version 不是已发布的正式版里最新的，只构建、不部署"
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @nextskin/docs...
      - run: pnpm --filter @nextskin/docs build
      - if: steps.target.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-dist
          path: apps/docs/dist/
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 令牌只能改这个账号的 Workers 脚本和 nextskin.org 的 Workers 路由，不能改 DNS；environment 只允许 v* 标签使用
    environment: docs
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # 只装文档站的依赖：要的是锁文件里那个版本的 wrangler
      - run: pnpm install --frozen-lockfile --filter @nextskin/docs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: apps/docs/dist/
      - run: pnpm --filter @nextskin/docs exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
