# 本地的 pnpm check、pnpm test:db、pnpm e2e 在这里原样再跑一遍，不用 Turborepo 缓存：类型检查以这里的 TS 7 为准（ADR-0014）。
# 第三方 action 固定到提交 SHA，升级时连同注释里的版本号一起改。
name: CI

on:
  push:
    # 维护分支（ADR-0047）上的提交也要跑：修订版从那里发
    branches: [main, 'release/**']
    paths-ignore: ['**/*.md', 'docs/**', 'spikes/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'spikes/**']
  workflow_dispatch:

permissions:
  contents: read

# 只取消 PR 上被新提交取代的运行。推送的运行各占一组：同组里排队的运行会被后来者顶掉，
# 共用一组就不能保证每次推送都有结果
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 26 是基线，跑完整的 pnpm check；Node 24 是 engines 的下限（ADR-0013），只跑测试：
        # lint、类型检查（TS 7 是原生程序，@types/node 固定为 24）和格式检查的结果与 Node 版本无关
        include:
          - { name: check (Node 26), node: 26, command: pnpm check }
          - { name: test (Node 24), node: 24, command: pnpm turbo run test }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 组件测试和 story 在 Chromium 里跑
      - run: pnpm --filter @nextskin/web exec playwright install --with-deps --only-shell chromium
      - run: ${{ matrix.command }}

  test-db:
    name: test:db（SQLite / MySQL / MariaDB / PostgreSQL）
    runs-on: ubuntu-24.04
    # 平时 11–14 分钟；慢的 runner 上光测试就跑了 19 分钟，20 分钟的上限被撞上过
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 用 packages/db/compose.yaml 起三个数据库容器，与本地相同
      - run: pnpm test:db

  e2e:
    name: build + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nextskin/web exec playwright install --with-deps --only-shell chromium
      # e2e 依赖 build，build 又依赖构建涉及的每个包的 typecheck（turbo.json）：Next 关了构建期类型检查
      - run: pnpm e2e
      # 用刚组装的发行目录构建镜像，只读的根文件系统下启动、doctor、停止（ADR-0040）：基础镜像的升级在这里先验一遍
      - run: bash packages/launcher/docker/smoke.sh dist/nextskin

  visual:
    # 组件截图回归：浏览器跑在与 @playwright/test 同版本的官方镜像里（packages/ui/playwright.config.ts），
    # 基线和本地 `pnpm test:visual` 拍出来的是同一套
    name: test:visual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      # 不一致时下载实际截图和差异图对比
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: packages/ui/test-results/
          retention-days: 7

  pack:
    # 打包冒烟测试（ADR-0035）：在仓库外用 npm 安装 pnpm pack 出来的 SDK 和构建命令，类型检查、构建一个插件
    name: test:pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pack

  changeset:
    # 不变量 9：插件 SDK 的 src 有改动就必须附 changeset（.changeset/config.json 的 changedFilePatterns）
    name: changeset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changeset status 要找 base 和 HEAD 的分叉点
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm changeset status
        env:
          # PR 与目标分支比较；推送时与这个分支推送前的提交比较
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::找不到比较基准 $BASE（新建分支或强制推送），跳过 changeset 检查"
            exit 0
          fi
          # changeset status 只认这段范围里新加的 changeset。发布提交（changeset version）把它们挪进
          # .changeset/pre/ 或删掉，和发布提交一起推送时整段看就像没附，所以在发布提交处分段：
          # 之前的改动在发布提交的父提交上检查，之后的从发布提交算起
          changeset="$PWD/node_modules/@changesets/cli/bin.js"
          from=$BASE
          for release in $(git log --reverse --format=%H "$BASE..HEAD" -- packages/plugin-sdk/CHANGELOG.md); do
            if [ "$(git rev-parse "$release^")" != "$(git rev-parse "$from")" ]; then
              git worktree add --detach "$RUNNER_TEMP/changeset-$release" "$release^"
              (cd "$RUNNER_TEMP/changeset-$release" && node "$changeset" status --since="$from")
            fi
            from=$release
          done
          pnpm changeset status --since="$from"
