packages:
  - apps/*
  - packages/*
  - plugins/*
  - tests/contract

allowBuilds:
  esbuild: false
  # next-intl 的消息提取功能（useExtracted）才用到，我们不用，不跑它们的安装脚本
  '@parcel/watcher': false
  '@swc/core': false

catalog:
  '@better-auth/core': 1.7.10
  '@better-auth/oauth-provider': 1.7.10
  '@better-auth/passkey': 1.7.10
  '@formatjs/icu-messageformat-parser': 3.5.18
  '@next/eslint-plugin-next': 16.4.2
  '@playwright/test': 1.64.1
  '@storybook/addon-docs': 10.6.2
  '@storybook/addon-vitest': 10.6.2
  '@storybook/react-vite': 10.6.2
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/browser-playwright': 5.0.5
  better-auth: 1.7.10
  eslint: 10.12.0
  hono: 4.13.13
  kysely: 0.29.6
  mysql2: 3.24.6
  next: 16.4.2
  next-intl: 4.14.9
  pg: 8.23.1
  pixelarticons: 2.4.2
  react: 19.3.1
  react-dom: 19.3.1
  rolldown: 1.2.14
  storybook: 10.6.2
  tailwindcss: 4.3.3
  typescript-eslint: 8.71.2
  use-intl: 4.14.9
  vite: 8.3.4
  vitest: 5.0.5
  zod: 4.6.7

overrides:
  # Image Optimization 关着（不变量 8），用不到 sharp。它是 next 的可选依赖，装上就会连同 libvips 的原生库被
  # Turbopack 追踪进 standalone，发行包只能在构建机的系统和架构上运行（ADR-0008）。Turbopack 不理会
  # outputFileTracingExcludes，所以直接不装。e2e 的 smoke.spec.ts 检查产物里没有原生库
  'next>sharp': '-'
